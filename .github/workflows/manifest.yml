name: Update portfolio manifest

on:
  push:
    branches: [main]
    paths:
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "**.webp"
      - "**.gif"
      - "**.avif"
      - "generate-manifest.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node generate-manifest.js
      - name: Commit manifest if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || (git commit -m "Update manifest.json [skip ci]" && git push)
